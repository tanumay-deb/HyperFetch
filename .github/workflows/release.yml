name: release

# Builds the no-Python-needed Windows installer (and a portable zip) and attaches
# them to the GitHub Release. Runs automatically on a version tag; can also be run
# by hand against an existing tag (e.g. v2.0.0) via "Run workflow".
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build + attach (e.g. v2.0.0)'
        required: true

permissions:
  contents: write          # upload assets to the release

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Resolve version from the tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $ver = $tag.TrimStart('v')
          "tag=$tag"     | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$ver" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build app + installer
        run: .\build.ps1 -Installer -Version ${{ steps.ver.outputs.version }}

      - name: Smoke-test the frozen binary
        run: dist\HyperFetch\HyperFetch.exe --selftest

      - name: Package a portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\HyperFetch\* -DestinationPath "dist\HyperFetch-${{ steps.ver.outputs.version }}-portable.zip"

      # Browser extension zips, straight from the tagged source. The Chrome one
      # is what gets uploaded to the Web Store; the Edge one has no store listing
      # at all, so this release asset is its only distribution channel. Only the
      # runtime files are copied, so test/ (and its node_modules) never ships.
      # Entries are written explicitly with '/' separators: Compress-Archive on
      # Windows PowerShell emits '\', which can stop a browser resolving icons/.
      - name: Package the browser extensions
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $runtime = @("manifest.json","background.js","content.js",
                       "popup.html","popup.js","welcome.html","welcome.js")
          $bs = [char]92; $fwd = [char]47
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          foreach ($browser in @("chrome","edge")) {
            $src   = "${browser}_ext"
            $stage = Join-Path "dist" "extstage/$browser"
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            foreach ($f in $runtime) { Copy-Item (Join-Path $src $f) $stage }
            Copy-Item (Join-Path $src "icons") $stage -Recurse
            $ver = (Get-Content (Join-Path $src "manifest.json") -Raw | ConvertFrom-Json).version
            $zip = Join-Path "dist" "hyperfetch-$browser-$ver.zip"
            if (Test-Path $zip) { Remove-Item -LiteralPath $zip -Force }
            $fs = [System.IO.File]::Open((Join-Path $PWD $zip), [System.IO.FileMode]::CreateNew)
            $ar = New-Object System.IO.Compression.ZipArchive($fs, [System.IO.Compression.ZipArchiveMode]::Create)
            foreach ($file in (Get-ChildItem -LiteralPath $stage -Recurse -File)) {
              $rel = $file.FullName.Substring((Get-Item $stage).FullName.Length + 1).Replace($bs, $fwd)
              $entry = $ar.CreateEntry($rel, [System.IO.Compression.CompressionLevel]::Optimal)
              $es = $entry.Open()
              $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
              $es.Write($bytes, 0, $bytes.Length)
              $es.Dispose()
            }
            $ar.Dispose(); $fs.Dispose()
            Write-Host "packaged $browser extension v$ver -> $zip"
          }

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/installer/*.exe
            dist/HyperFetch-*-portable.zip
            dist/hyperfetch-chrome-*.zip
            dist/hyperfetch-edge-*.zip
