name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # PySide6 needs a few X libs to import on headless Linux
      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -ra

  lint-js:
    name: extension syntax (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check extension scripts
        run: |
          node --check chrome_ext/background.js
          node --check chrome_ext/content.js
          node --check chrome_ext/popup.js
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('chrome_ext/manifest.json','utf8'))"
      - name: Content-script behavior tests (jsdom)
        working-directory: chrome_ext/test
        run: |
          npm install
          npm test

  site:
    name: users site (react + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Type errors and a broken bundle are the two ways this breaks the app
      # silently, so both run before anything is packaged.
      - name: Install
        working-directory: site-src
        run: npm install --no-audit --no-fund
      - name: Type-check
        working-directory: site-src
        run: npx tsc -b --noEmit
      - name: Build
        working-directory: site-src
        run: npm run build
      - name: The bundle actually exists
        run: |
          test -f site/index.html
          test -d site/assets
          echo "site bundle: $(du -sh site | cut -f1)"

  server:
    name: build server (no Qt)
    runs-on: windows-latest
    needs: [test, site]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build the users site
        working-directory: site-src
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build the server
        run: python -m PyInstaller --noconfirm --clean HyperFetchServer.spec
      # The point of this build is that Qt is not in it. If PySide6 ever comes
      # back the exe still builds and then fails at runtime, which is the worst
      # way to find out.
      - name: No Qt in the artifact
        shell: bash
        run: |
          if ls dist/HyperFetchServer/_internal | grep -iE '^(pyside6|shiboken6)'; then
            echo "Qt was bundled into the server build"; exit 1
          fi
          du -sh dist/HyperFetchServer
      - name: It starts
        run: |
          .\dist\HyperFetchServer\HyperFetchServer.exe --check
          if ($LASTEXITCODE -ne 0) { throw "the server build does not start" }
      - uses: actions/upload-artifact@v4
        with:
          name: HyperFetchServer-windows
          path: dist/HyperFetchServer

  package:
    name: build Windows app
    runs-on: windows-latest
    needs: [test, site]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Build
        run: |
          python -c "from PIL import Image; Image.open('assets/icon.png').convert('RGBA').save('assets/icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          python -m PyInstaller --noconfirm --clean HyperFetch.spec
      - name: Smoke-test the frozen binary
        run: dist\HyperFetch\HyperFetch.exe --selftest
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperFetch-windows
          path: dist/HyperFetch
